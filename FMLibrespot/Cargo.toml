[package]
name = "fmlibrespot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
# No audio backend: Retrofy plays the decoded PCM through an Audio Queue (src/audio.rs). rustls with bundled roots
# because iOS 6 neither has the needed Security.framework APIs nor current root certificates.
# with-dns-sd announces Retrofy for Spotify Connect login through iOS's own Bonjour (dns_sd.h).
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots", "with-dns-sd"] }
futures-util = { version = "0.3", default-features = false }
log = "0.4"
# Same versions librespot uses. Lets Retrofy reach accounts.spotify.com, which only offers AES-GCM
# ciphers that iOS 6's Secure Transport doesn't have.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# PKCE login for Retrofy's own client ID (src/webapi_login.rs). All already used by librespot.
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"

[patch.crates-io]
# sysinfo calls macOS-only libproc functions that the libc crate doesn't define for iOS.
# See patches/README.md.
sysinfo = { path = "patches/sysinfo" }
# ring has no assembly for 32-bit ARM on Apple platforms. See patches/README.md.
ring = { path = "patches/ring" }
# dns-sd's build script only recognises Apple targets with "darwin" in the name. See patches/README.md.
dns-sd = { path = "patches/dns-sd" }
# Spotify rejects librespot's iOS identity with TryAnotherAP. See patches/README.md.
librespot-core = { path = "patches/librespot-core" }
