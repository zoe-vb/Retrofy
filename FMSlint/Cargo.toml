[package]
name = "fmslint"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg"] }

[build-dependencies]
slint-build = "1"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
